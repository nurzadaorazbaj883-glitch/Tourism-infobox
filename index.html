<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Алматы қаласы — Tourism Infobox</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade-up{animation:fadeUp .45s ease both}
.line-clamp-1{overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:1}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------- Icons (Lucide paths) ---------- */
const P = {
  compass:'<circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>',
  pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
  msg:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  heart:'<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
  globe:'<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  chev:'<path d="m9 18 6-6-6-6"/>',
  star:'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
  back:'<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
  nav:'<polygon points="3 11 22 2 13 21 11 13 3 11"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>'
};
const ic = (n, c='') => `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${c}">${P[n]}</svg>`;
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

/* ---------- Data ---------- */
const dict = {
  kz:{title:'Алматы қаласы',savedCount:'Таңдаулылар',langTitle:'Тіл',favoritesTitle:'Таңдаулыларыңыз',emptyFavTitle:'Әзірге таңдаулылар жоқ',emptyFavDesc:'Орынды осында сақтау үшін жүрекше белгісін басыңыз.',searchPlaceholder:'Орындарды іздеу...',exploreTab:'Шолу',mapTab:'Карта',forumTab:'Форум',
    categories:{all:'Барлығы',mountains:'Таулар мен табиғат',culture:'Мәдениет & Тарих',parks:'Саябақтар',food:'Мейрамханалар'},
    howToGet:'Қалай жетуге болады?',workingHours:'Жұмыс уақыты',back:'Артқа',writePost:'Пікір немесе жазба қалдыру',postTitlePlaceholder:'Тақырып...',postContentPlaceholder:'Ойыңызбен бөлісіңіз...',publish:'Жариялау'},
  ru:{title:'Алматы қаласы',savedCount:'Избранные',langTitle:'Язык',favoritesTitle:'Ваши избранные',emptyFavTitle:'В избранном пока пусто',emptyFavDesc:'Нажмите на иконку сердечка, чтобы сохранить интересное место.',searchPlaceholder:'Поиск мест...',exploreTab:'Обзор',mapTab:'Карта',forumTab:'Форум',
    categories:{all:'Все',mountains:'Горы и природа',culture:'Культура & История',parks:'Парки',food:'Рестораны'},
    howToGet:'Как добраться?',workingHours:'Режим работы',back:'Назад',writePost:'Оставить запись',postTitlePlaceholder:'Заголовок...',postContentPlaceholder:'Поделитесь впечатлениями...',publish:'Опубликовать'},
  en:{title:'Алматы қаласы',savedCount:'Favorites',langTitle:'Language',favoritesTitle:'Your Favorites',emptyFavTitle:'No favorites yet',emptyFavDesc:'Click the heart icon to save places here.',searchPlaceholder:'Search places...',exploreTab:'Explore',mapTab:'Map',forumTab:'Forum',
    categories:{all:'All',mountains:'Nature & Mountains',culture:'Culture & History',parks:'Parks',food:'Dining'},
    howToGet:'How to get there?',workingHours:'Working Hours',back:'Back',writePost:'Create a Post',postTitlePlaceholder:'Title...',postContentPlaceholder:'Share your thoughts...',publish:'Publish'}
};
const W = f => `https://commons.wikimedia.org/wiki/Special:FilePath/${f}?width=800`;
const places = [
  {id:1,name:{kz:'Көктөбе',ru:'Кок Тобе',en:'Kok Tobe'},category:'mountains',image:W('Almaty,_Kok-tobe_exposition_3.jpg'),rating:4.8,reviewsCount:1420,
   description:{kz:'Алматының оңтүстік-шығысындағы биік төбе. Қаланың панорамалық көрінісі ашылады, аспан жолы (канатная дорога) мен саябақ орналасқан.',ru:'Живописная гора на высоте 1100 метров над уровнем моря с панорамным видом на весь город. Сюда ведет знаменитая канатная дорога.',en:'A scenic mountain rising 1,100 meters above sea level offering panoramic views of the city, amusement park, and the iconic cable car.'},
   howToGet:{kz:'Достық даңғылы мен Абай көшесінің қиылысынан канатты жолмен немесе №95 автобуспен.',ru:'На канатной дороге от станции у Дворца Республики или на автобусе №95.',en:'By cable car from Dostyk Ave or bus #95.'},hours:'10:00 - 23:00'},
  {id:2,name:{kz:'Шымбұлақ',ru:'Шымбулак',en:'Shymbulak'},category:'mountains',image:W('Shymbulak,_Almaty_(P1180178).jpg'),rating:4.9,reviewsCount:2310,
   description:{kz:'Ең танымал тау шаңғысы курорты. Теңіз деңгейінен 2260 метр биіктікте орналасқан, тамаша трассалар мен тау пейзаждары бар.',ru:'Знаменитый горнолыжный курорт в живописном ущелье Заилийского Алатау на высоте 2260 м.',en:'World-renowned ski resort located in the Zailiysky Alatau mountain gorge at 2,260 meters elevation.'},
   howToGet:{kz:'Медеу кешенінен гондолалық жолмен немесе арнайы эко-таксимен.',ru:'На гондольной дороге от высокогорного комплекса «Медеу» или на эко-такси.',en:'By gondola lift from Medeu high-altitude complex or eco-taxi.'},hours:'09:00 - 18:00'},
  {id:3,name:{kz:'Медеу',ru:'Медео',en:'Medeu'},category:'mountains',image:W('Medeu,_Almaty_(P1180176).jpg'),rating:4.9,reviewsCount:3150,
   description:{kz:'Әлемдегі ең биік орналасқан ірі мұз айдыны спорт кешені. Тау шатқалында таза ауа мен керемет табиғат.',ru:'Самый высокогорный в мире государственный спортивный комплекс для зимних видов спорта с ледовым полем.',en:'The highest altitude Olympic-size ice skating rink in the world, nestled in a breathtaking mountain valley.'},
   howToGet:{kz:'Достық даңғылымен жүретін №12 автобуспен соңғы аялдамаға дейін.',ru:'На автобусе №12 от остановки гостиницы «Казахстан» (пр. Достык).',en:'Take bus #12 from Dostyk Avenue straight to the terminus.'},hours:'10:00 - 23:00 (Мұз айдыны маусымдық)'},
  {id:4,name:{kz:'Үлкен Алматы көлі',ru:'Большое Алматинское озеро',en:'Big Almaty Lake'},category:'mountains',image:W('Big_Almaty_Lake.jpg'),rating:4.8,reviewsCount:1840,
   description:{kz:'Іле Алатауы ұлттық паркіндегі табиғи альпілік көл. Судың түсі жыл мезгіліне қарай әдемі көгілдір және жасыл түске өзгереді.',ru:'Живописное альпийское озеро природного происхождения в Заилийском Алатау, окруженное величественными вершинами.',en:'A stunning natural alpine lake in the Tien Shan mountains, famous for its striking turquoise and emerald waters.'},
   howToGet:{kz:'Алмарасан шатқалы арқылы жеке көлікпен немесе жаяу туристік соқпақпен.',ru:'На автомобиле или такси через ущелье Алма-Арасан (требуется экологический сбор).',en:'By car or organized hiking tour via the Alma-Arasan gorge.'},hours:'Тәулік бойы (Күндіз барған жөн)'},
  {id:5,name:{kz:'Панфиловшылар паркі',ru:'Парк 28 гвардейцев-панфиловцев',en:'Panfilov Park'},category:'parks',image:W('Zenkov_Cathedral_Winter.jpg'),rating:4.7,reviewsCount:920,
   description:{kz:'Қала орталығындағы тарихи саябақ. Ішінде бірегей ағаштан салынған Вознесенск соборы орналасқан.',ru:'Исторический парк в центре города, где расположен знаменитый деревянный Вознесенский собор.',en:'Historic central park housing the stunning, all-wooden Zenkov Cathedral built without a single nail.'},
   howToGet:{kz:'Қонаев пен Гоголь көшелерінің қиылысы. «Жібек жолы» метро станциясынан жаяу.',ru:'Пересечение улиц Гоголя и Кунаева. Рядом станция метро «Жибек Жолы».',en:'Located near Gogol and Kunaev streets. Close to Zhibek Zholy metro station.'},hours:'08:00 - 23:00'},
  {id:6,name:{kz:'Көк Базар',ru:'Зеленый базар',en:'Green Bazaar'},category:'culture',image:W('Green_Bazaar,_Almaty.jpg'),rating:4.6,reviewsCount:1100,
   description:{kz:'Алматының басты және ең көне базарларының бірі. Мұнда шығыс тәттілері, дәмдеуіштер, жеміс-жидектер мен ұлттық өнімдерді табуға болады.',ru:'Легендарный крытый рынок Алматы, где царит атмосфера восточного базара с огромным выбором деликатесов и специй.',en:'The legendary central marketplace of Almaty offering fresh fruits, spices, local delicacies, and oriental sweets.'},
   howToGet:{kz:'Жібек жолы даңғылы мен Пушкин көшесінің қиылысы.',ru:'Пересечение пр. Жибек Жолы и ул. Пушкина.',en:'Intersection of Zhibek Zholy Ave and Pushkin St.'},hours:'08:00 - 19:00'}
];
const langs = [{code:'kz',label:'Қазақша'},{code:'ru',label:'Русский'},{code:'en',label:'English'}];
const intro = {kz:'Алматының таулары, мәдениеті мен саябақтарын бірге ашамыз.',ru:'Откройте для себя горы, культуру и парки Алматы.',en:'Discover the mountains, culture and parks of Almaty.'};
const sectionDesc = {
  explore:{kz:'Орындар мен көрікті жерлер',ru:'Места и достопримечательности',en:'Places & attractions'},
  map:{kz:'Қала картасы',ru:'Карта города',en:'City map'},
  forum:{kz:'Қауымдастық пікірлері',ru:'Мнения сообщества',en:'Community posts'},
  favorites:{kz:'Сақталған орындар',ru:'Сохранённые места',en:'Saved places'}
};
const card = 'bg-white rounded-2xl border border-stone-200/70 shadow-[0_1px_3px_rgba(28,25,23,0.05)]';

/* ---------- State ---------- */
const S = {
  tab:'explore', lang:'kz', cat:'all', q:'', active:null, screen:'home', anim:true,
  favs:[1,3], title:'', content:'', posting:false,
  posts:[
    {id:1,author:'Айгүл С.',avatar:'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150',time:'2 сағат бұрын',title:'Шымбұлақта қалың қар жауды!',content:'Бүгін таңертең тауға шықтық, ауа райы керемет, шаңғы тебуге таптырмас уақыт. Бағалар мен жағдай туралы сұрақтарыңыз болса қойыңыз!',likes:24,comments:5,category:'Таулар'},
    {id:2,author:'Тимур Н.',avatar:'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150',time:'Кеше',title:'Көктөбеден көрініс',content:'Кешкі Алматы шамдары әсіресе Көктөбеден өте әдемі көрінеді. Баршаға кеңес беремін!',likes:42,comments:12,category:'Қала'}
  ]
};

/* ---------- Views ---------- */
const img = (p, cls) => p.image
  ? `<img src="${p.image}" alt="${esc(p.name[S.lang])}" class="${cls}" loading="lazy" onerror="imgFail(this)">`
  : fallback(p.name[S.lang], cls);
const fallback = (alt, cls) => `<div role="img" aria-label="${esc(alt)}" class="${cls} bg-gradient-to-br from-emerald-100 to-slate-200 flex items-center justify-center">${ic('pin','w-8 h-8 text-emerald-600/60')}</div>`;
window.imgFail = el => { const d = document.createElement('div'); d.innerHTML = fallback(el.alt, el.className); el.replaceWith(d.firstChild); };

function sections(t){ return [
  {id:'explore',label:t.exploreTab,icon:'compass'},{id:'map',label:t.mapTab,icon:'pin'},
  {id:'forum',label:t.forumTab,icon:'msg'},{id:'favorites',label:t.savedCount,icon:'heart'}]; }

function viewHome(t){
  return `<main class="fade-up max-w-md mx-auto px-6 min-h-screen flex flex-col justify-center py-12">
    <div class="text-center space-y-4">
      <div class="w-12 h-12 mx-auto rounded-2xl bg-white border border-stone-200 shadow-sm flex items-center justify-center">${ic('compass','w-6 h-6 text-emerald-600')}</div>
      <p class="text-[11px] tracking-[0.25em] uppercase text-stone-400 font-medium">Tourism Infobox</p>
      <h1 class="text-3xl font-semibold text-stone-900 tracking-tight">${t.title}</h1>
      <p class="text-sm text-stone-500 leading-relaxed max-w-xs mx-auto">${intro[S.lang]}</p>
    </div>
    <div class="mt-9 space-y-2.5">
      <div class="flex items-center justify-center space-x-1.5 text-[11px] uppercase tracking-wider text-stone-400">${ic('globe','w-3.5 h-3.5')}<span>${t.langTitle}</span></div>
      <div class="grid grid-cols-3 gap-2">${langs.map(l=>`<button data-a="lang" data-v="${l.code}" class="py-2.5 text-xs font-medium rounded-xl border transition ${S.lang===l.code?'bg-stone-900 text-white border-stone-900 shadow-sm':'bg-white text-stone-600 border-stone-200 hover:border-stone-300'}">${l.label}</button>`).join('')}</div>
    </div>
    <div class="mt-8 grid grid-cols-2 gap-3">${sections(t).map(i=>`
      <button data-a="goto" data-v="${i.id}" class="${card} p-4 text-left hover:shadow-md hover:-translate-y-0.5 transition group">
        <div class="w-9 h-9 rounded-xl bg-stone-100 text-stone-600 flex items-center justify-center group-hover:bg-emerald-50 group-hover:text-emerald-600 transition">${ic(i.icon,'w-5 h-5')}</div>
        <h3 class="mt-3 text-sm font-semibold text-stone-900">${i.label}</h3>
        <p class="mt-0.5 text-[11px] text-stone-400 leading-snug">${i.id==='favorites'?S.favs.length+' · ':''}${sectionDesc[i.id][S.lang]}</p>
      </button>`).join('')}</div>
  </main>`;
}

const heartBtn = (id, cls) => `<button data-a="fav" data-v="${id}" class="${cls}">${ic('heart','w-4 h-4 '+(S.favs.includes(id)?'fill-rose-500':''))}</button>`;

function viewDetail(t){
  const p = S.active, L = S.lang;
  return `<div class="${card} overflow-hidden">
    <div class="relative h-64 w-full bg-stone-100">${img(p,'w-full h-full object-cover')}
      <button data-a="closePlace" class="absolute top-3 left-3 bg-white/90 backdrop-blur text-stone-800 p-2 rounded-full shadow-sm hover:bg-white transition">${ic('back','w-4 h-4')}</button>
      ${heartBtn(p.id,'absolute top-3 right-3 bg-white/90 backdrop-blur p-2 rounded-full shadow-sm text-rose-500 hover:scale-105 transition')}
    </div>
    <div class="p-5 space-y-4">
      <div class="flex items-start justify-between gap-3">
        <h2 class="text-xl font-semibold text-stone-900 tracking-tight">${p.name[L]}</h2>
        <div class="flex items-center space-x-1 text-xs font-medium text-stone-600 shrink-0 mt-1">${ic('star','w-3.5 h-3.5 fill-amber-400 text-amber-400')}<span>${p.rating}</span><span class="text-stone-400">(${p.reviewsCount})</span></div>
      </div>
      <p class="text-sm text-stone-600 leading-relaxed">${p.description[L]}</p>
      <div class="rounded-xl bg-stone-50 border border-stone-200/70 p-4 space-y-3 text-xs">
        <div class="flex items-start space-x-2.5">${ic('nav','w-4 h-4 text-emerald-600 shrink-0 mt-0.5')}<div><span class="font-semibold text-stone-900 block">${t.howToGet}</span><span class="text-stone-600">${p.howToGet[L]}</span></div></div>
        <div class="flex items-start space-x-2.5 pt-3 border-t border-stone-200/70">${ic('info','w-4 h-4 text-emerald-600 shrink-0 mt-0.5')}<div><span class="font-semibold text-stone-900 block">${t.workingHours}</span><span class="text-stone-600">${p.hours}</span></div></div>
      </div>
      <button data-a="closePlace" class="w-full bg-stone-900 text-white text-sm font-medium py-3 rounded-xl hover:bg-stone-800 transition">${t.back}</button>
    </div></div>`;
}

function viewExplore(t){
  const L = S.lang, q = S.q.toLowerCase();
  const list = places.filter(p => (S.cat==='all'||p.category===S.cat) && (p.name[L].toLowerCase().includes(q)||p.description[L].toLowerCase().includes(q)));
  return `<div class="space-y-4">
    <h2 class="text-2xl font-semibold text-stone-900 tracking-tight">${t.exploreTab}</h2>
    <div class="relative">${ic('search','w-4 h-4 text-stone-400 absolute left-3.5 top-3.5')}
      <input id="q" type="text" value="${esc(S.q)}" placeholder="${t.searchPlaceholder}" class="w-full bg-white pl-10 pr-4 py-3 text-sm rounded-xl border border-stone-200 focus:outline-none focus:border-stone-400 transition"></div>
    <div class="flex space-x-2 overflow-x-auto pb-1">${Object.entries(t.categories).map(([k,l])=>`<button data-a="cat" data-v="${k}" class="whitespace-nowrap px-3.5 py-1.5 text-xs font-medium rounded-full border transition ${S.cat===k?'bg-stone-900 text-white border-stone-900':'bg-white text-stone-600 border-stone-200 hover:border-stone-300'}">${l}</button>`).join('')}</div>
    <div class="space-y-4">${list.length?list.map(p=>`
      <div data-a="open" data-v="${p.id}" class="${card} overflow-hidden cursor-pointer group hover:shadow-md transition">
        <div class="relative h-44 w-full overflow-hidden bg-stone-100">${img(p,'w-full h-full object-cover group-hover:scale-105 transition duration-500')}
          ${heartBtn(p.id,'absolute top-3 right-3 bg-white/90 backdrop-blur p-2 rounded-full shadow-sm text-rose-500 hover:scale-105 transition')}</div>
        <div class="p-4 flex items-center justify-between gap-3">
          <div class="min-w-0"><h3 class="font-semibold text-stone-900 text-[15px]">${p.name[L]}</h3><p class="text-xs text-stone-500 mt-0.5 line-clamp-1">${p.description[L]}</p></div>
          <div class="flex items-center space-x-2 shrink-0"><span class="flex items-center text-xs text-stone-600 font-medium">${ic('star','w-3 h-3 fill-amber-400 text-amber-400 mr-1')}${p.rating}</span>${ic('chev','w-4 h-4 text-stone-300 group-hover:text-stone-500 group-hover:translate-x-0.5 transition')}</div>
        </div>
      </div>`).join(''):`<div class="${card} p-8 text-center"><p class="text-sm text-stone-500">Ештеңе табылмады / Ничего не найдено</p></div>`}</div>
  </div>`;
}

function viewMap(t){
  return `<div class="space-y-4"><h2 class="text-2xl font-semibold text-stone-900 tracking-tight">${t.mapTab}</h2>
    <div class="${card} p-6 space-y-4 text-center">
      <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto">${ic('pin','w-6 h-6')}</div>
      <div><h3 class="font-semibold text-stone-900">Алматы картасы</h3><p class="text-xs text-stone-500 mt-1">Интерактивті карта жүктелуде...</p></div>
      <div class="relative h-64 rounded-xl overflow-hidden border border-stone-200 bg-stone-100 flex items-center justify-center">
        <div class="absolute inset-0 opacity-70 bg-[radial-gradient(#d6d3d1_1px,transparent_1px)] [background-size:16px_16px]"></div>
        <span class="relative z-10 text-xs bg-white px-3 py-1.5 rounded-full shadow-sm font-medium text-stone-700 border border-stone-200">📍 Мекенжайлар картада белгіленген</span>
      </div></div></div>`;
}

function viewForum(t){
  return `<div class="space-y-4"><h2 class="text-2xl font-semibold text-stone-900 tracking-tight">${t.forumTab}</h2>
    <form id="postForm" class="${card} p-4 space-y-3">
      <h3 class="font-semibold text-stone-900 text-sm flex items-center space-x-2">${ic('msg','w-4 h-4 text-emerald-600')}<span>${t.writePost}</span></h3>
      <input id="ptitle" type="text" value="${esc(S.title)}" placeholder="${t.postTitlePlaceholder}" class="w-full bg-stone-50 px-3 py-2.5 text-xs rounded-xl border border-stone-200 focus:outline-none focus:border-stone-400">
      <textarea id="pcontent" rows="2" placeholder="${t.postContentPlaceholder}" class="w-full bg-stone-50 px-3 py-2.5 text-xs rounded-xl border border-stone-200 focus:outline-none focus:border-stone-400 resize-none">${esc(S.content)}</textarea>
      <button type="submit" ${S.posting?'disabled':''} class="w-full bg-stone-900 text-white font-medium py-2.5 rounded-xl text-xs hover:bg-stone-800 transition">${t.publish}</button>
    </form>
    <div class="space-y-3">${S.posts.map(p=>`
      <div class="${card} p-4 space-y-3">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-2.5"><img src="${esc(p.avatar)}" alt="${esc(p.author)}" class="w-8 h-8 rounded-full object-cover bg-stone-100">
            <div><h4 class="text-xs font-semibold text-stone-900">${esc(p.author)}</h4><span class="text-[10px] text-stone-400">${esc(p.time)}</span></div></div>
          <span class="text-[10px] bg-stone-100 text-stone-600 px-2 py-0.5 rounded-full font-medium">${esc(p.category)}</span>
        </div>
        <div><h5 class="font-semibold text-sm text-stone-900">${esc(p.title)}</h5><p class="text-xs text-stone-600 mt-1 leading-relaxed">${esc(p.content)}</p></div>
        <div class="flex items-center space-x-4 text-xs text-stone-400 pt-3 border-t border-stone-100">
          <button class="flex items-center space-x-1 hover:text-rose-500 transition">${ic('heart','w-3.5 h-3.5')}<span>${p.likes}</span></button>
          <button class="flex items-center space-x-1 hover:text-emerald-600 transition">${ic('msg','w-3.5 h-3.5')}<span>${p.comments}</span></button>
        </div></div>`).join('')}</div></div>`;
}

function viewFavs(t){
  const L = S.lang, fp = places.filter(p => S.favs.includes(p.id));
  return `<div class="space-y-4">
    <div class="flex items-baseline justify-between"><h2 class="text-2xl font-semibold text-stone-900 tracking-tight">${t.favoritesTitle}</h2><span class="text-xs text-stone-400">${fp.length}</span></div>
    ${fp.length?fp.map(p=>`
      <div data-a="open" data-v="${p.id}" class="${card} cursor-pointer flex items-center p-3 space-x-3 hover:shadow-md transition">
        ${img(p,'w-16 h-16 rounded-xl object-cover shrink-0')}
        <div class="flex-1 min-w-0"><h4 class="font-semibold text-stone-900 text-sm truncate">${p.name[L]}</h4><p class="text-xs text-stone-500 truncate mt-0.5">${p.description[L]}</p></div>
        ${heartBtn(p.id,'p-2 text-rose-500 hover:bg-rose-50 rounded-full transition').replace('w-4 h-4 ','w-4 h-4 fill-rose-500 ')}
      </div>`).join(''):`
      <div class="${card} p-8 text-center space-y-3">
        <div class="w-12 h-12 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mx-auto">${ic('heart','w-6 h-6')}</div>
        <div><h4 class="font-semibold text-stone-900 text-sm">${t.emptyFavTitle}</h4><p class="text-xs text-stone-500 mt-1 max-w-xs mx-auto">${t.emptyFavDesc}</p></div></div>`}
  </div>`;
}

function viewApp(t){
  const body = S.active ? viewDetail(t) : ({explore:viewExplore,map:viewMap,forum:viewForum,favorites:viewFavs}[S.tab])(t);
  return `<header class="bg-white/90 backdrop-blur-md border-b border-stone-200/70 sticky top-0 z-30">
      <div class="max-w-md mx-auto px-4 h-14 flex items-center justify-between">
        <button data-a="home" class="flex items-center space-x-2 text-stone-900 hover:opacity-70 transition" aria-label="Tourism Infobox">
          <span class="w-7 h-7 rounded-lg bg-stone-900 text-white flex items-center justify-center">${ic('home','w-3.5 h-3.5')}</span><span class="text-sm font-semibold tracking-tight">Tourism Infobox</span></button>
        <div class="flex items-center bg-stone-100 rounded-lg p-0.5">${langs.map(l=>`<button data-a="lang" data-v="${l.code}" class="px-2 py-1 text-[10px] font-semibold rounded-md transition ${S.lang===l.code?'bg-white text-stone-900 shadow-sm':'text-stone-500 hover:text-stone-700'}">${l.code.toUpperCase()}</button>`).join('')}</div>
      </div></header>
    <main class="${S.anim?'fade-up ':''}max-w-md mx-auto px-4 pt-5 pb-28 space-y-5">${body}</main>
    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-stone-200/70 z-40">
      <div class="max-w-md mx-auto px-2 py-2 grid grid-cols-4">${sections(t).map(i=>{const a=S.tab===i.id;return `
        <button data-a="goto" data-v="${i.id}" class="flex flex-col items-center py-1.5 rounded-xl transition ${a?'text-stone-900':'text-stone-400 hover:text-stone-600'}">
          ${ic(i.icon,'w-5 h-5 '+(a&&i.id==='favorites'?'fill-stone-900':''))}<span class="text-[10px] font-medium mt-1">${i.label}</span><span class="mt-1 w-1 h-1 rounded-full ${a?'bg-emerald-500':'bg-transparent'}"></span></button>`}).join('')}</div>
    </nav>`;
}

/* ---------- Render (keeps focus/caret in text fields) ---------- */
const app = document.getElementById('app');
function render(){
  const ae = document.activeElement, id = ae && ae.id, ss = ae && ae.selectionStart, se = ae && ae.selectionEnd;
  const t = dict[S.lang];
  document.documentElement.lang = S.lang === 'kz' ? 'kk' : S.lang;
  app.className = 'min-h-screen bg-stone-50 text-stone-800 font-sans antialiased select-none';
  app.innerHTML = S.screen === 'home' ? viewHome(t) : viewApp(t);
  S.anim = false;
  if (id) { const el = document.getElementById(id); if (el) { el.focus(); try { el.setSelectionRange(ss, se); } catch(e){} } }
}
const nav = fn => { fn(); S.anim = true; window.scrollTo(0,0); render(); };

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const v = el.dataset.v, id = Number(v);
  switch (el.dataset.a) {
    case 'lang': S.lang = v; render(); break;
    case 'goto': nav(() => { S.tab = v; S.active = null; S.screen = 'app'; }); break;
    case 'home': nav(() => { S.active = null; S.screen = 'home'; }); break;
    case 'cat': S.cat = v; render(); break;
    case 'open': nav(() => { S.active = places.find(p => p.id === id); }); break;
    case 'closePlace': nav(() => { S.active = null; }); break;
    case 'fav': S.favs = S.favs.includes(id) ? S.favs.filter(x => x !== id) : [...S.favs, id]; render(); break;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.q = e.target.value; render(); }
  if (e.target.id === 'ptitle') S.title = e.target.value;
  if (e.target.id === 'pcontent') S.content = e.target.value;
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id !== 'postForm' || S.posting || !S.title.trim() || !S.content.trim()) return;
  S.posting = true; render();
  setTimeout(() => {
    const L = S.lang;
    S.posts.unshift({id:Date.now(),author:L==='kz'?'Қонақ':L==='ru'?'Гость':'Guest',avatar:'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150',
      time:L==='kz'?'Жаңа ғана':L==='ru'?'Только что':'Just now',title:S.title,content:S.content,likes:0,comments:0,category:'Жалпы'});
    S.title = S.content = ''; S.posting = false; render();
  }, 400);
});

render();
</script>
</body>
</html>
